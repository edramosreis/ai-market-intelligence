# Used only with compose.m3.test.yaml through scripts/m3.py --test --vectors.
services:
  db-test:
    image: ai-market-intelligence-postgres:m3-vector-test
    pull_policy: never
    build:
      context: ./docker/m3-vector-postgres
      dockerfile: Dockerfile
      target: vector
  tests:
    environment:
      RUN_VECTOR_TESTS: "1"

name: ai-market-intelligence
services:
  api:
    image: ai-market-intelligence:local
    command: [serve, --host, "0.0.0.0", --port, "8000"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Generate .env first}
      POSTGRES_READ_USER: ${POSTGRES_READ_USER:?Generate .env first}
      POSTGRES_READ_PASSWORD: ${POSTGRES_READ_PASSWORD:?Generate .env first}
      API_MAX_WINDOW_DAYS: ${API_MAX_WINDOW_DAYS:-3653}
      API_STALE_AFTER_SECONDS: ${API_STALE_AFTER_SECONDS:-900}
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      AGENT_DEADLINE_SECONDS: ${AGENT_DEADLINE_SECONDS:-60}
      AGENT_MAX_MODEL_REQUESTS: ${AGENT_MAX_MODEL_REQUESTS:-4}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-3}
      AGENT_MAX_OUTPUT_TOKENS: ${AGENT_MAX_OUTPUT_TOKENS:-2048}
      AGENT_MAX_QUESTION_CHARS: ${AGENT_MAX_QUESTION_CHARS:-4000}
      AGENT_MAX_ANSWER_CHARS: ${AGENT_MAX_ANSWER_CHARS:-8000}
      AGENT_MAX_CONTEXT_BYTES: ${AGENT_MAX_CONTEXT_BYTES:-128000}
      AGENT_MAX_TOOL_OUTPUT_BYTES: ${AGENT_MAX_TOOL_OUTPUT_BYTES:-32000}
      AGENT_MAX_RESPONSE_BYTES: ${AGENT_MAX_RESPONSE_BYTES:-64000}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 10
      start_period: 5s

  db:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Generate .env first}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Generate .env first}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Generate .env first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  migrate:
    profiles: [tools]
    build:
      context: .
      target: runtime
    image: ai-market-intelligence:local
    command: [init-db]
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Generate .env first}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:?Generate .env first}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Generate .env first}
      POSTGRES_INGEST_USER: ${POSTGRES_INGEST_USER:?Generate .env first}
      POSTGRES_INGEST_PASSWORD: ${POSTGRES_INGEST_PASSWORD:?Generate .env first}
      POSTGRES_READ_USER: ${POSTGRES_READ_USER:?Generate .env first}
      POSTGRES_READ_PASSWORD: ${POSTGRES_READ_PASSWORD:?Generate .env first}

  check:
    profiles: [tools]
    image: ai-market-intelligence:local
    command: [check-db]
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Generate .env first}
      POSTGRES_READ_USER: ${POSTGRES_READ_USER:?Generate .env first}
      POSTGRES_READ_PASSWORD: ${POSTGRES_READ_PASSWORD:?Generate .env first}

  ingest:
    profiles: [tools]
    image: ai-market-intelligence:local
    command: [ingest]
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Generate .env first}
      POSTGRES_INGEST_USER: ${POSTGRES_INGEST_USER:?Generate .env first}
      POSTGRES_INGEST_PASSWORD: ${POSTGRES_INGEST_PASSWORD:?Generate .env first}

volumes:
  postgres_data:

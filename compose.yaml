name: ai-market-intelligence
services:
  db:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Generate .env first}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Generate .env first}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Generate .env first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  migrate:
    profiles: [tools]
    build:
      context: .
      target: runtime
    image: ai-market-intelligence:local
    command: [init-db]
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Generate .env first}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:?Generate .env first}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Generate .env first}
      POSTGRES_INGEST_USER: ${POSTGRES_INGEST_USER:?Generate .env first}
      POSTGRES_INGEST_PASSWORD: ${POSTGRES_INGEST_PASSWORD:?Generate .env first}
      POSTGRES_READ_USER: ${POSTGRES_READ_USER:?Generate .env first}
      POSTGRES_READ_PASSWORD: ${POSTGRES_READ_PASSWORD:?Generate .env first}

  check:
    profiles: [tools]
    image: ai-market-intelligence:local
    command: [check-db]
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Generate .env first}
      POSTGRES_READ_USER: ${POSTGRES_READ_USER:?Generate .env first}
      POSTGRES_READ_PASSWORD: ${POSTGRES_READ_PASSWORD:?Generate .env first}

  ingest:
    profiles: [tools]
    image: ai-market-intelligence:local
    command: [ingest]
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Generate .env first}
      POSTGRES_INGEST_USER: ${POSTGRES_INGEST_USER:?Generate .env first}
      POSTGRES_INGEST_PASSWORD: ${POSTGRES_INGEST_PASSWORD:?Generate .env first}

volumes:
  postgres_data:

# Standalone test project: no host ports or persistent volumes, never the development DB.
name: ai-market-intelligence-tests
services:
  db-test:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_DB: market_intelligence_test
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Generate .env first}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Generate .env first}
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  tests:
    build:
      context: .
      target: development
    depends_on:
      db-test:
        condition: service_healthy
    environment:
      RUN_POSTGRES_TESTS: "1"
      POSTGRES_HOST: db-test
      POSTGRES_PORT: 5432
      POSTGRES_DB: market_intelligence_test
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:?Generate .env first}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Generate .env first}
      POSTGRES_INGEST_USER: ${POSTGRES_INGEST_USER:?Generate .env first}
      POSTGRES_INGEST_PASSWORD: ${POSTGRES_INGEST_PASSWORD:?Generate .env first}
      POSTGRES_READ_USER: ${POSTGRES_READ_USER:?Generate .env first}
      POSTGRES_READ_PASSWORD: ${POSTGRES_READ_PASSWORD:?Generate .env first}

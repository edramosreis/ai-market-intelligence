name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate temporary test configuration
        run: python3 scripts/init_local_env.py

      - name: Build test environment
        run: docker compose -f compose.test.yaml build tests

      - name: Formatting, linting and types
        run: |
          docker compose -f compose.test.yaml run --rm --no-deps tests ruff format --check src migrations tests scripts
          docker compose -f compose.test.yaml run --rm --no-deps tests ruff check src migrations tests scripts
          docker compose -f compose.test.yaml run --rm --no-deps tests mypy

      - name: Isolated test suite
        run: docker compose -f compose.test.yaml up --abort-on-container-exit --exit-code-from tests

      - name: Clean up test environment
        if: always()
        run: docker compose -f compose.test.yaml down

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin"

      - name: Scan available Git history
        run: '"$RUNNER_TEMP/gitleaks-bin/gitleaks" git --redact --log-opts="--all" .'

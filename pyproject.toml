[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-market-intelligence"
version = "0.1.0"
description = "A reproducible market-data and AI engineering platform"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "openai>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
market-intelligence = "market_intelligence.cli:main"

[dependency-groups]
dev = ["mypy>=1.15,<2", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/market_intelligence"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "migrations", "tests", "scripts"]

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires the isolated PostgreSQL test service"]
